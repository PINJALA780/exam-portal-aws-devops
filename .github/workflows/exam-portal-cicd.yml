
name: Exam Portal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-portal-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "848635215310"
  ECR_REPOSITORY: exam-portal-staging-backend
  ECS_CLUSTER: exam-portal-staging
  ECS_SERVICE: exam-portal-staging-backend
  TASK_FAMILY: exam-portal-staging-backend
  S3_BUCKET: exam-portal-staging-frontend-225c8a4c4482d3e7301164dc90
  CLOUDFRONT_ID: E1ZQA9IX2HJZPW
  WEBSITE_URL: https://d2ulirdq336tyh.cloudfront.net

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examportal_test
          POSTGRES_USER: examtest
          POSTGRES_PASSWORD: examtest_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examtest -d examportal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: examportal_test
      DB_USER: examtest
      DB_PASSWORD: examtest_password
      DB_SSL: "false"
      JWT_SECRET: ci-test-jwt-secret-only
      PORT: "5001"
      NODE_ENV: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: node src/migrate.js

      - name: Start backend API
        working-directory: backend
        run: |
          node src/server.js > /tmp/exam-api.log 2>&1 &
          echo $! > /tmp/exam-api.pid

      - name: Wait for backend API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/api/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to start"
          cat /tmp/exam-api.log
          exit 1

      - name: Run backend tests
        working-directory: backend
        run: |
          node --test \
            tests/daily-learning-records.test.js \
            tests/domain-selection.test.js \
            tests/student-id.test.js \
            tests/exam-start-flow.test.js

      - name: Show backend logs if tests fail
        if: failure()
        run: |
          if [ -f /tmp/exam-api.log ]; then
            tail -100 /tmp/exam-api.log
          fi

      - name: Build React frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

          if grep -R -q \
            'http://localhost:5000/api' dist/assets; then
            echo "Invalid localhost API URL detected"
            exit 1
          fi

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          mkdir -p backend/certs

          curl --fail --silent --show-error \
            --location --retry 3 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            --output backend/certs/global-bundle.pem

          test -s backend/certs/global-bundle.pem

          grep -q "BEGIN CERTIFICATE" \
            backend/certs/global-bundle.pem

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare ECS task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-current.json

          jq -e --arg image "$IMAGE_URI" '
            if ([.containerDefinitions[].name] |
                index("backend")) == null
            then
              error("Backend container not found")
            else
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              | .containerDefinitions |= map(
                  if .name == "backend"
                  then .image = $image
                  else .
                  end
                )
            end
          ' task-current.json > task-deploy.json

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-deploy.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          wait-for-minutes: 20

      - name: Upload frontend to S3
        run: |
          set -euo pipefail

          aws s3 sync frontend/dist/ \
            "s3://$S3_BUCKET/" \
            --region "$AWS_REGION"

          aws s3 cp frontend/dist/index.html \
            "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/" "/index.html" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$INVALIDATION_ID"

      - name: Verify application health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$WEBSITE_URL/api/health" | tee health.json

          jq -e \
            '.status == "ok" and .database == "connected"' \
            health.json
