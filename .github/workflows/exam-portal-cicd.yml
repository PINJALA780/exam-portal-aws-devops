
name: Exam Portal CI/CD 

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-portal-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "848635215310"
  ECR_REPOSITORY: exam-portal-staging-backend
  ECS_CLUSTER: exam-portal-staging
  ECS_SERVICE: exam-portal-staging-backend
  TASK_FAMILY: exam-portal-staging-backend
  S3_BUCKET: exam-portal-staging-frontend-225c8a4c4482d3e7301164dc90
  CLOUDFRONT_ID: E1ZQA9IX2HJZPW
  WEBSITE_URL: https://d2ulirdq336tyh.cloudfront.net

jobs:
  deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Build React frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

          if grep -R -q 'http://localhost:5000/api' dist/assets; then
            echo "Invalid localhost API address found"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Prepare ECS task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-current.json

          jq -e --arg image "$IMAGE_URI" '
            if ([.containerDefinitions[].name] | index("backend")) == null
            then error("Backend container not found")
            else
              del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              | .containerDefinitions |= map(
                  if .name == "backend"
                  then .image = $image
                  else .
                  end
                )
            end
          ' task-current.json > task-deploy.json

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-deploy.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          wait-for-minutes: 20

      - name: Upload frontend to S3
        run: |
          set -euo pipefail

          aws s3 sync frontend/dist/ \
            "s3://$S3_BUCKET/" \
            --region "$AWS_REGION"

          aws s3 cp frontend/dist/index.html \
            "s3://$S3_BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail

          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/" "/index.html" \
            --query "Invalidation.Id" \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$ID"

      - name: Verify application health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$WEBSITE_URL/api/health" | tee health.json

          jq -e \
            '.status == "ok" and .database == "connected"' \
            health.json
